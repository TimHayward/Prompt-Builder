services:
  prompt-builder:
    build:
      context: .
      dockerfile: Dockerfile

    image: promptbuilder:latest
    container_name: prompt-builder

    restart: always

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    volumes:
      - prompt_builder_data:/app/data

    # The image's CMD initialises the database and then serves the built app;
    # overriding it here is what used to force the development server.

volumes:
  prompt_builder_data:
    name: prompt_builder_data
