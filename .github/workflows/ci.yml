name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 24 for npm 11: the lockfile records the peer resolutions npm 10
      # rejects, which is why the Docker image moved off node:22 too.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 falls back to compiling from source when no prebuild
      # matches, so this step is the slow one on a cold cache.
      - name: Install dependencies
        run: npm ci

      # Formatting first: a diff of reflowed lines makes every other failure
      # below harder to read.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests plus the integration suite, which builds its own SQLite
      # database in a temp directory — nothing to provision here.
      - name: Test
        run: npm test

      # Routes open the database lazily, so a build needs no database at all.
      - name: Build
        run: npm run build

  # The image is the one thing the jobs above cannot speak for: they all run
  # from the repository, where every path resolves. The container copies a
  # subset, and has shipped unable to start because of it.
  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t prompt-builder:ci .

      # Building is not the test. The image that could not resolve its migration
      # module built perfectly and then died on its first command.
      - name: Start it
        run: docker run -d --name prompt-builder-ci -p 3000:3000 prompt-builder:ci

      # /api/settings opens the database, so an answer here means db:init ran and
      # the schema is usable. A static page would reply without touching SQLite.
      - name: Wait for the app to answer
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/settings > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The application never answered on port 3000."
          exit 1

      - name: Check the database was initialised
        run: docker logs prompt-builder-ci 2>&1 | grep -q 'Database initialization complete'

      # Printed whatever happened: on a failure this is the only account of why
      # the container stopped.
      - name: Container logs
        if: always()
        run: docker logs prompt-builder-ci 2>&1 || true

      - name: Stop it
        if: always()
        run: docker rm -f prompt-builder-ci || true

  # Separate job: the browser download and a production build make this the slow
  # half, and a failure here should be distinguishable from a unit test failure.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The config builds the app and serves it against a throwaway database.
      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
